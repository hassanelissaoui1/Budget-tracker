name: CI Budget Tracker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget-tracker-back
    steps:
      - uses: actions/checkout@v4
      - name: Préparer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Lancer les tests Backend
        run: ./mvnw test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget-tracker-front
    steps:
      - uses: actions/checkout@v4
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Installer les dépendances
        run: npm ci
      - name: Lancer les tests Frontend
        run: npm test