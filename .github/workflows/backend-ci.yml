name: Backend CI - JUnit Tests

on:
  push:
    branches: [ main ]
    paths:
      - "budget-tracker-back/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches: [ main ]
    paths:
      - "budget-tracker-back/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: budget-tracker-back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Give permission to Maven wrapper
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw -B clean test
